[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-sdk"
version = "0.1.0"
description = "Six-layer guardrail security pipeline for LLM applications"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
