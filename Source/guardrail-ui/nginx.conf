server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward /api/* to FastAPI, stripping the /api prefix (mirrors vite proxy rewrite)
    # Authorization header is forwarded automatically by nginx
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
