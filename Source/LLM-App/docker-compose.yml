services:
  api:
    build:
      context: ..          # projects/ — gives access to both ragqaapp/ and guardrailsdk/
      dockerfile: ragqaapp/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env         # provides ANTHROPIC_API_KEY, BACKEND, etc.
    environment:
      CHROMA_PATH: /app/chroma_db
      RULES_FILE: /app/guardrails.yaml
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./guardrails.yaml:/app/guardrails.yaml

  demo-ui:
    build:
      context: demo-ui
    ports:
      - "9091:80"
    depends_on:
      - api

  rules-ui:
    build:
      context: ../guardrail-ui
    ports:
      - "8081:80"
    depends_on:
      - api
